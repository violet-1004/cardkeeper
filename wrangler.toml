# 🌟 1. 專案名稱（消除警告的關鍵）
name = "cardkeeper"

# 🌟 2. 相容性設定（對應您後台的設定）
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 🌟 3. Cloudflare Pages 預設的建置輸出目錄 (Next.js)
pages_build_output_dir = ".vercel/output/static"

# 🌟 4. 您專屬的 D1 資料庫綁定
[[d1_databases]]
binding = "DB"
database_name = "my-card-db"
database_id = "12bd1cc8-3276-4e33-80a2-4dbf528a6371"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cardkeeper-images"